{% extends "base.html" %}

{% block title %} - Acceso prohibido{% endblock %}

{% block content %}

<div class="container text-center py-5">

    <div class="mb-4">
        <img src="{{ url_for('static', filename='images/403.png') }}"
             alt="Error 403"
             class="img-fluid"
             style="max-width: 600px;">
    </div>

    <h1 class="display-4 fw-bold text-danger">403</h1>

    <h2 class="mb-3">Acceso prohibido</h2>

    <p class="text-muted mb-4">
        Lo sentimos, no tienes autorización para ver este contenido.
    </p>

    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-home"></i> Volver al inicio
    </a>

</div>

{% endblock %}
